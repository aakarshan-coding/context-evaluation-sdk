[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contexteval"
version = "0.1.0"
description = "Find out why your RAG agent's context failed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []  # core is stdlib only

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
chroma = ["chromadb>=0.5"]
pinecone = ["pinecone>=5"]
demo = ["chromadb>=0.5", "openai>=1.40"]
dev = ["pytest>=8", "chromadb>=0.5", "openai>=1.40", "anthropic>=0.34", "httpx"]

[project.scripts]
contexteval = "contexteval._cli:main"

[tool.setuptools.packages.find]
include = ["contexteval*"]

[tool.setuptools.package-data]
contexteval = ["ui.html", "demo/corpus/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
