[project]
name = "contexteval"
version = "0.1.0"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # core is stdlib only

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
chroma = ["chromadb>=0.5"]
pinecone = ["pinecone>=5"]
demo = ["chromadb>=0.5", "openai>=1.40"]
dev = ["pytest>=8", "chromadb>=0.5", "openai>=1.40", "anthropic>=0.34", "httpx"]

[project.scripts]
contexteval = "contexteval._cli:main"

[tool.setuptools.package-data]
contexteval = ["ui.html", "demo/corpus/*.md"]

# TODO(P0): enable a lint that fails on imports of contexteval._* from outside the package
# (ruff's private-import rule; confirm the rule code and preview status before relying on it).
